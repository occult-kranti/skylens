name: Deploy to GitHub Pages

# OPTIONAL (Option B in README): move this file to .github/workflows/pages.yml
# and set Settings → Pages → Source: "GitHub Actions".
# It regenerates data/stars.json + data/tle-snapshot.json from upstream on every deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data files (star catalog + fresh TLE snapshot)
        run: python3 tools/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
